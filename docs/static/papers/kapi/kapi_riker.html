/* Kamiwaza brand palette — matches docs.kamiwaza.ai (--kamiwaza-* tokens). */
:root{--bg:#0f172a;--card:#1e293b;--ink:#f8fafc;--ink2:#cbd5e1;--ink3:#94a3b8;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 90px;}
/* A board whose table is wider than the text column breaks out of it, centred, rather

body:has(.tw){display:flex;justify-content:center;}
.wrap:has(.tw){max-width:none;width:fit-content;min-width:min(1180px,100%);}

.wide{max-width:none;width:max-content;min-width:100%;margin-inline:auto;}
header.top{border-bottom:1px solid var(--rule);padding:30px 0 20px;margin-bottom:30px;}
.brand{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;

a.brand:hover{color:var(--accent);text-decoration:none;}
h1{font-size:2rem;font-weight:700;margin:0 0 10px;letter-spacing:-.015em;}
.sub{color:var(--ink2);max-width:74ch;margin:0;}
div.sub p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-size:1.15rem;margin:38px 0 4px;}
.note{color:var(--ink3);font-size:13px;max-width:78ch;}
ul.papers{margin:6px 0 0;padding-left:1.15rem;}
ul.papers li{margin:2px 0;}
.tw{border:1px solid var(--rule);border-radius:4px;background:var(--card);margin:18px 0;
    width:max-content;min-width:100%;max-width:100%;}
@media(max-width:900px){.tw{overflow-x:auto;width:auto;}}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums;}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap;}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;

td.n,th.n{text-align:right;font-family:var(--mono);}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#243449}
td.name{font-weight:600}
.hi{color:var(--good)}.lo{color:var(--bad)}.mid{color:var(--warn)}

footer{border-top:1px solid var(--rule);margin-top:60px;padding-top:18px;color:var(--ink3);font-size:12px;}

// 100.0 must mean 100. Rounding 99.95 up would assert a flawless run that did not happen, so
// anything short of perfect floors to 1dp instead (99.95 -> 99.9); an exact 100 still prints 100.0.
function pct(v,d){if(v===null||v===undefined||v==="")return "—";
  const n=+v; if(Number.isNaN(n))return v;
  if(n<100 && Math.round(n*Math.pow(10,d))/Math.pow(10,d)>=100)
    return (Math.floor(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
  return n.toFixed(d);}
function num(v,d){if(v===null||v===undefined||v==="")return "—";
  const n=+v; return Number.isNaN(n)?v:n.toLocaleString(undefined,
    {minimumFractionDigits:d,maximumFractionDigits:d});}
function mount(id,COLS,DATA,opt){
  opt=opt||{}; let sk=opt.sort||COLS[0].key;
  const ASC={}; COLS.forEach(c=>{if(c.asc)ASC[c.key]=1;});
  let sd=ASC[sk]?1:-1;
  const root=document.getElementById(id);
  const grouped=COLS.some(c=>c.group);
  function head(){
    let h="";
    if(grouped){
      h+='<tr class="gh"><th></th><th></th><th></th>';
      let i=0; while(i<COLS.length){let j=i; while(j<COLS.length&&COLS[j].group===COLS[i].group)j++;
        h+=`<th colspan="${j-i}" class="gl">${COLS[i].group||""}</th>`; i=j;}
      h+="</tr>";}
    h+='<tr><th class="n">#</th><th>model</th><th>mode</th>'+
       COLS.map(c=>`<th class="n srt${sk===c.key?' on':''}" data-k="${c.key}" title="${c.note||''}">`+
                   `${c.label}${sk===c.key?(sd<0?' ▾':' ▴'):''}</th>`).join("")+"</tr>";
    return h;}
  function body(){
    const rs=DATA.slice().sort((a,b)=>{
      const x=a[sk],y=b[sk];
      const xn=(x===null||x===undefined||x==="")?-Infinity:+x,
            yn=(y===null||y===undefined||y==="")?-Infinity:+y;
      if(Number.isNaN(xn)||Number.isNaN(yn))return String(x||"").localeCompare(String(y||""))*sd*-1;
      return (xn-yn)*sd;});
    return rs.map((x,i)=>`<tr><td class="n rank">${i+1}</td>`+
      `<td class="name">${x.flag?x.flag+" ":""}${x.model}</td><td class="mode">${x.mode||""}</td>`+
      COLS.map(c=>{const v=x[c.key];
        const t=c.fmt==="int"?num(v,0):(c.fmt==="num"?num(v,c.d===undefined?1:c.d):pct(v,c.d===undefined?1:c.d));
        const extra=(c.gap&&x[c.gap]!==undefined&&x[c.gap]!==null)?
          ` <span class="gap">+${(+x[c.gap]).toFixed(1)}</span>`:"";
        let cls=c.cls||"";
        if(c.band&&v!==null&&v!==undefined&&v!==""){const n=+v, q=c.invert?100-n:n;
          cls+=q>=90?" hi":(q<50?" lo":" mid");}
        return `<td class="n ${cls}">${t}${extra}</td>`;}).join("")+"</tr>").join("");}
  function draw(){root.innerHTML=`<table><thead>${head()}</thead><tbody>${body()}</tbody></table>`;
    root.querySelectorAll("th.srt").forEach(th=>th.onclick=()=>{
      const k=th.dataset.k; if(k===sk){sd=-sd;}else{sk=k;sd=ASC[k]?1:-1;} draw();});}
  draw();}
