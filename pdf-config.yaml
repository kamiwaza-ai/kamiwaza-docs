# PDF Documentation Generation Configuration
# Defines profiles for generating PDF documentation packages

profiles:
  # Offline Installation Profile
  # For customers doing air-gapped/offline installations
  offline-install:
    name: "Kamiwaza Offline Installation Guide"
    description: "Full platform documentation for air-gapped customers (all in-site links resolve inside the PDF)"
    filename: "kamiwaza-offline-install"
    cover:
      title: "Kamiwaza AI Platform"
      subtitle: "Offline Installation Guide"
      includeVersion: true
      includeLogo: true
    # Same discovery as full-docs plus Extensions plugin docs (sidebars-extensions.ts), so links
    # to Kaizen, Workroom Manager, models, observability, etc. navigate within the merged PDF.
    includeAll: true
    excludeDocs:
      - team/kamiwaza
      - team/jobs
      - team/mts
    options:
      includeTOC: true
      includePageNumbers: true
      includeHeaders: true
      pageNumberStart: 1

  # Full Documentation Profile
  # Platform documentation
  full-docs:
    name: "Kamiwaza AI Documentation"
    description: "Platform documentation"
    filename: "kamiwaza-docs"
    cover:
      title: "Kamiwaza AI Platform"
      subtitle: "Platform Documentation"
      includeVersion: true
      includeLogo: true
    # Use includeAll with excludeDocs for automatic document discovery
    includeAll: true
    excludeDocs:
      # Exclude team/company pages from customer documentation
      - "team/kamiwaza"
      - "team/jobs"
      - "team/mts"
    options:
      includeTOC: true
      includePageNumbers: true
      includeHeaders: true
      pageNumberStart: 1

# Global PDF Settings
settings:
  # Default version (can be overridden via CLI with `--version <name>`).
  # Allowed values:
  #   "current"            - trunk content under docs/docs/ and docs/sdk/ (the
  #                          "Latest" entry in the navbar dropdown). Picks up
  #                          edits as soon as they land in the working tree;
  #                          recommended default so the PDF always reflects the
  #                          most recent in-development docs.
  #   "latest"             - newest published snapshot per docs/versions.json
  #                          (e.g. version-0.12.0/). Use this when producing a
  #                          frozen, customer-facing artifact tied to a release.
  #   "0.11.0", "0.5.1"... - any specific snapshot listed in versions.json.
  defaultVersion: "current"

  # Output directory (relative to project root)
  outputDir: "dist/pdf"

  # PDF generation options
  pdf:
    format: "A4"
    margin:
      top: "20mm"
      right: "15mm"
      bottom: "20mm"
      left: "15mm"
    printBackground: true
    preferCSSPageSize: false

  # Document source for PDF generation
  source:
    mode: "offline-build"
    buildDir: "docs/build-offline"

  # Links to docs not included in a profile are rewritten from file: to this base URL for clickable PDF links (no local-file prompts). Printed body text uses a short note in docs/src/css/pdf.css instead of the raw URL.
  publicDocsBaseUrl: "https://docs.kamiwaza.ai"

  # Server settings for local build
  server:
    port: 9003
    baseUrl: "http://localhost:9003"

  # Styling
  css:
    customStylesheet: "docs/src/css/pdf.css"
