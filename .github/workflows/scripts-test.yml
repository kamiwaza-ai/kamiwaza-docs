name: Scripts Tests

# Runs the node:test suite and production docs build on relevant PRs. The fast
# tests cover docs tooling and sidebar structure; the build verifies that every
# sidebar document id resolves to an actual document.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs/scripts/**"
      - "docs/sidebars.ts"
      - "docs/docs/**"
      - "docs/versioned_docs/**"
      - "docs/versioned_sidebars/**"
      - "docs/docusaurus.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scripts-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: scripts/*.test.ts (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to the lower bound of the engines.node range in package.json
          # so this workflow catches regressions that depend on Node 24+ APIs
          # before they hit downstream consumers still on Node 22.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run scripts unit tests
        run: npm test

      - name: Build production documentation
        run: npm run build:docs
