name: Docs Tests and Build

# Runs the node:test suite and production docs build on relevant PRs. The fast
# tests cover docs tooling and sidebar structure; the build verifies that every
# sidebar document id resolves to an actual document.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs/scripts/**"
      - "docs/sidebars.ts"
      - "docs/docs/**"
      - "docs/extensions/**"
      - "docs/sdk/**"
      - "docs/api/**"
      - "docs/research/**"
      - "docs/versioned_docs/**"
      - "docs/versioned_sidebars/**"
      - "docs/docusaurus.config.ts"
      - "docs/package.json"
      - "docs/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scripts-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Docs tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout SDK documentation source
        uses: actions/checkout@v4
        with:
          repository: kamiwaza-ai/kamiwaza-sdk
          # Reviewed source for the generated SDK surface. Bump this SHA when
          # synchronizing SDK documentation so CI remains reproducible.
          ref: 06398a7905eee36861436ba8d3a6847f84de4eb1
          path: kamiwaza-sdk
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to the lower bound of the engines.node range in package.json
          # so this workflow catches regressions that depend on Node 24+ APIs
          # before they hit downstream consumers still on Node 22.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install docs dependencies
        run: npm ci --ignore-scripts --prefix docs

      - name: Materialize generated SDK documentation
        run: npm run sync-sdk
        env:
          KW_SDK_DOCS: ${{ github.workspace }}/kamiwaza-sdk

      - name: Verify generated SDK documentation
        run: >-
          find docs/sdk/current/services -type f
          \( -name '*.md' -o -name '*.mdx' \)
          -size +0c -print -quit | grep -q .

      - name: Run scripts unit tests
        run: npm test

      - name: Build production documentation
        run: npm run build:docs
