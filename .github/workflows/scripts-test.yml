name: Scripts Tests

# Runs the node:test suite under scripts/*.test.ts on every PR. The PDF
# pipeline link-handling logic (pdf-link-utils.ts) is the riskiest part of
# the docs tooling; without this workflow its 50+ unit tests would only run
# when a contributor remembered to invoke `npm test` locally and regressions
# would silently make it to develop.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs/scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/scripts-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: scripts/*.test.ts (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to the lower bound of the engines.node range in package.json
          # so this workflow catches regressions that depend on Node 24+ APIs
          # before they hit downstream consumers still on Node 22.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run scripts unit tests
        run: npm test
